# Pings the Messenger Supabase backend every 3 days so the free tier never auto-pauses (7-day idle limit).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hwgjmsmzoicfsmookadh.supabase.co/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: sb_publishable_vP4R3fZFvaWXo1VK0tX93A_uHlKsRQs")
          echo "Supabase responded: $code"
          test "$code" -lt 500
